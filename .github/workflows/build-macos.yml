name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # outdir 对应 tools/build/build.py 按架构划分的输出目录
          - arch: x86_64
            runner: macos-15-intel
            outdir: macOS-intel
          - arch: arm64
            runner: macos-15
            outdir: macOS-m
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --locked

      # 缓存 Nuitka 的 C 编译缓存(ccache)与下载工具,依赖不变时跨运行复用
      - name: Cache Nuitka compilation
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ matrix.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-macos-${{ matrix.arch }}-

      # 缓存 uv 下载的 wheel(PySide6 等体积大),加快 uv sync
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/uv
          key: uv-macos-${{ matrix.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-macos-${{ matrix.arch }}-

      - name: Check environment
        run: |
          uname -m
          clang --version
          xcode-select -p
          .venv/bin/python --version

      # 使用项目现有的跨平台 Nuitka 构建工具
      # tools/build/build.py 自动使用 uv 管理的 .venv,macOS 上通过 --clang 使用 Apple Clang
      - name: Build
        run: uv run python tools/build/build.py

      # macOS 产物为平台目录下的 StartInfo.app(--mode=app),直接打 zip
      - name: Package
        run: |
          cd "tools/build/output/${{ matrix.outdir }}"
          zip -r "$GITHUB_WORKSPACE/StartInfo-macos-${{ matrix.arch }}.zip" *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartInfo-macos-${{ matrix.arch }}
          path: StartInfo-macos-${{ matrix.arch }}.zip
